<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Открой Хабаровский край</title>
  <style>
    :root{--ink:#082f49;--blue:#0369a1;--sky:#38bdf8;--ice:#eef9ff;--sand:#fffaf0;--white:#fff;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(#dff5ff,#fff 420px)}
    header{padding:18px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between}header b{font-size:20px}.badge{background:#fff8;padding:8px 12px;border-radius:999px;font-size:13px}
    main{max-width:1120px;margin:auto;padding:10px 20px 80px}.hero{min-height:300px;border-radius:30px;padding:42px;background:radial-gradient(circle at 80% 10%,#7dd3fc 0 8%,transparent 9%),radial-gradient(circle at 75% 35%,#0ea5e9 0 16%,transparent 17%),linear-gradient(135deg,#075985,#0284c7 62%,#164e63);color:white;display:flex;flex-direction:column;justify-content:end;box-shadow:0 22px 50px #07598533}.hero h1{font-size:clamp(36px,7vw,72px);line-height:1;margin:0;max-width:800px}.hero p{font-size:19px;max-width:620px;margin:18px 0 0}
    nav{display:flex;gap:8px;margin:24px 0;overflow:auto}nav button{border:0;background:white;padding:12px 18px;border-radius:999px;color:var(--ink);white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px #07598512}nav button.active{background:var(--ink);color:white}
    section{display:none}section.active{display:block}.panel{background:white;border:1px solid #bae6fd;border-radius:24px;padding:24px;box-shadow:0 10px 30px #07598510}.upload{border:2px dashed #7dd3fc;border-radius:20px;min-height:240px;display:grid;place-items:center;text-align:center;padding:30px;cursor:pointer;background:var(--ice)}.upload.drag{background:#d8f3ff;border-color:var(--blue)}
    input[type=file]{display:none}.primary{border:0;border-radius:14px;padding:13px 20px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.primary:disabled{opacity:.5}.preview{max-width:100%;max-height:420px;border-radius:18px}.result{margin-top:20px;padding:20px;border-radius:18px;background:var(--sand)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border-radius:20px;overflow:hidden;background:white;border:1px solid #e0f2fe;box-shadow:0 8px 24px #07598510}.card img{width:100%;height:190px;object-fit:cover;background:#e0f2fe}.card div{padding:16px}.card h3{margin:0 0 6px}.card small{color:var(--muted)}
    .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fields label{font-size:13px;color:var(--muted)}.fields input{width:100%;padding:12px;border:1px solid #bae6fd;border-radius:12px;margin-top:5px}.route-item{padding:14px 0;border-bottom:1px solid #e2e8f0}.status{position:fixed;right:16px;bottom:16px;background:var(--ink);color:white;border-radius:14px;padding:10px 14px;font-size:13px}
    @media(max-width:760px){header .badge{display:none}.hero{min-height:360px;padding:26px}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.panel{padding:16px}.card img{height:220px}}
  </style>
</head>
<body>
<header><b>🌊 Открой Хабаровский край</b><span class="badge">AI-гид по Дальнему Востоку</span></header>
<main>
  <div class="hero"><h1>Край, который хочется узнать</h1><p>Наведите камеру на достопримечательность, узнайте её историю и добавьте место в маршрут.</p></div>
  <nav><button class="active" data-tab="recognize">📷 Распознать</button><button data-tab="catalog">🗺️ Каталог</button><button data-tab="route">🧭 Маршрут</button><button onclick="location.href='/docs'">API</button></nav>
  <section id="recognize" class="active"><div class="panel">
    <h2>Что перед вами?</h2><label class="upload" id="drop"><span id="prompt"><b>Выберите или перетащите фотографию</b><br><small>JPEG, PNG или WebP до 10 МБ</small></span><img id="preview" class="preview" hidden></label><input id="file" type="file" accept="image/jpeg,image/png,image/webp">
    <p><button id="run" class="primary" disabled>Распознать место</button></p><div id="result"></div>
  </div></section>
  <section id="catalog"><h2>Места Хабаровского края</h2><div id="cards" class="grid"></div></section>
  <section id="route"><div class="panel"><h2>Ближайшие места</h2><div class="fields"><label>Широта<input id="lat" type="number" value="48.4800" step=".0001"></label><label>Долгота<input id="lon" type="number" value="135.0710" step=".0001"></label><label>Количество<input id="limit" type="number" value="7" min="1" max="20"></label></div><p><button id="routeRun" class="primary">Построить маршрут</button></p><div id="routeResult"></div></div></section>
</main><div class="status" id="status">Проверяем сервер…</div>
<script>
  const $=s=>document.querySelector(s), file=$('#file'),drop=$('#drop'),preview=$('#preview'),run=$('#run');let selected;
  document.querySelectorAll('nav button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='catalog')loadCatalog()});
  drop.onclick=()=>file.click();['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.ondrop=e=>show(e.dataTransfer.files[0]);file.onchange=()=>show(file.files[0]);
  function show(f){if(!f)return;selected=f;preview.src=URL.createObjectURL(f);preview.hidden=false;$('#prompt').hidden=true;run.disabled=false}
  run.onclick=async()=>{run.disabled=true;run.textContent='Сопоставляем…';const form=new FormData();form.append('file',selected);try{const r=await fetch('/api/recognize',{method:'POST',body:form});const d=await r.json();if(!r.ok)throw Error(d.detail||'Ошибка API');$('#result').innerHTML=d.recognized?`<div class="result"><h2>✅ ${d.object.name}</h2><b>Уверенность ${(d.confidence*100).toFixed(1)}%</b><p>${d.object.description}</p><small>${d.object.municipality} · ${d.object.address||''}</small></div>`:`<div class="result"><h2>Объект не распознан</h2><p>Попробуйте другой ракурс или освещение.</p></div>`}catch(e){$('#result').innerHTML=`<div class="result">${e.message}</div>`}finally{run.disabled=false;run.textContent='Распознать место'}};
  let loaded=false;async function loadCatalog(){if(loaded)return;const d=await fetch('/api/objects').then(r=>r.json());$('#cards').innerHTML=d.objects.map(o=>`<article class="card">${o.example_images[0]?`<img loading="lazy" src="${o.example_images[0]}">`:'<div style="height:150px;background:#e0f2fe"></div>'}<div><small>${o.municipality} · ${o.category}</small><h3>${o.name}</h3><p>${o.description}</p></div></article>`).join('');loaded=true}
  $('#routeRun').onclick=async()=>{const d=await fetch('/api/plan-route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:+$('#lat').value,longitude:+$('#lon').value,limit:+$('#limit').value})}).then(r=>r.json());$('#routeResult').innerHTML=`<b>Оценочная длина: ${d.total_distance_km} км</b>`+d.route.map((x,i)=>`<div class="route-item"><b>${i+1}. ${x.name}</b><br><small>${x.distance_from_previous_km} км от предыдущей точки</small></div>`).join('')};
  fetch('/health').then(r=>r.json()).then(d=>{$('#status').textContent=d.index_ready?'● Система готова':'● Каталог доступен, индекс собирается';$('#status').style.background=d.index_ready?'#166534':'#9a3412'}).catch(()=>{$('#status').textContent='● Сервер недоступен';$('#status').style.background='#991b1b'});
</script></body></html>
