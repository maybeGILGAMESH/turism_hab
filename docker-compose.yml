name: discover-khabarovsk-krai-v3

x-app: &app
  image: discover-khabarovsk-krai:v3
  build:
    context: .
  env_file:
    - .env
  environment:
    HF_HUB_DISABLE_XET: "1"
    OLLAMA_BASE_URL: http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./catalog:/app/catalog
    - ./content:/app/content:ro
    - ./dataset/processed:/app/dataset/processed:ro
    - ./dataset/manifest.csv:/app/dataset/manifest.csv:ro
    - ./artifacts:/app/artifacts
    - ./runtime:/app/runtime
    - ./uploads:/app/uploads
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  streamlit:
    <<: *app
    command: ["streamlit", "run", "frontend.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_BASE_URL: http://api:8000
      HF_HUB_DISABLE_XET: "1"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8601:8501"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
