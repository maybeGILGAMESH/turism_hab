[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "discover-khabarovsk-krai"
version = "2.0.0"
description = "Consumer landmark recognition and travel companion for Khabarovsk Krai"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "faiss-cpu>=1.10,<2",
  "numpy>=1.26,<3",
  "open-clip-torch>=2.32,<4",
  "pillow>=11,<13",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "torch>=2.6,<3",
  "torchvision>=0.29,<0.30",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
data = [
  "beautifulsoup4>=4.13,<5",
  "imagehash>=4.3,<5",
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
  "tqdm>=4.67,<5",
]
ui = [
  "requests>=2.32,<3",
  "streamlit>=1.44,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
khab-collect = "data_pipeline:main"
khab-build-index = "build_index:main"
khab-api = "app:run"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["dataset", ".runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008", # FastAPI intentionally declares Depends/File in function signatures.
  "E501", # Long UI copy and embedded CSS are clearer when kept intact.
]
